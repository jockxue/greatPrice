server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      timeout: 8h
      cookie:
        http-only: true
        same-site: lax

spring:
  application:
    name: great-price-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  config:
    # 本地覆盖见 backend/.env（参考 .env.example，不提交）。
    # 两条都是 optional：从 backend/ 启动命中第一条，从仓库根目录启动（IDEA 默认工作目录）命中第二条。
    import:
      - optional:file:.env[.properties]
      - optional:file:backend/.env[.properties]
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # url / username / password 见 application-{profile}.yml
    hikari:
      connection-timeout: 5000
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
  jackson:
    time-zone: Asia/Shanghai
  task:
    scheduling:
      timezone: Asia/Shanghai

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      # 使用数据库自增主键，避免雪花 ID 超出 JS Number 精度
      id-type: auto

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  # 仅当管理员表为空且同时提供用户名和密码时创建第一个 ADMIN。不提供默认密码。
  admin:
    init-enabled: ${ADMIN_INIT_ENABLED:true}
    init-username: ${ADMIN_INIT_USERNAME:}
    init-password: ${ADMIN_INIT_PASSWORD:}
  deal-expiry:
    enabled: ${DEAL_EXPIRY_ENABLED:true}
    interval-ms: ${DEAL_EXPIRY_INTERVAL_MS:60000}
    batch-size: ${DEAL_EXPIRY_BATCH_SIZE:200}
  # 淘宝联盟凭证只从环境变量或 backend/.env 读取，不写默认密钥。
  taobao:
    enabled: ${TAOBAO_ENABLED:false}
    manual-sync-enabled: ${TAOBAO_MANUAL_SYNC_ENABLED:false}
    app-key: ${TAOBAO_APP_KEY:}
    app-secret: ${TAOBAO_APP_SECRET:}
    adzone-id: ${TAOBAO_ADZONE_ID:}
    site-id: ${TAOBAO_SITE_ID:}
    session: ${TAOBAO_SESSION:}
    gateway-url: ${TAOBAO_GATEWAY_URL:https://eco.taobao.com/router/rest}
    connect-timeout-ms: ${TAOBAO_CONNECT_TIMEOUT_MS:3000}
    read-timeout-ms: ${TAOBAO_READ_TIMEOUT_MS:8000}
    max-retries: ${TAOBAO_MAX_RETRIES:2}
