# 集成测试：H2 内存库（MySQL 兼容模式），表结构直接使用 sql/schema.sql，保证与 MySQL 脚本一致。
# IGNORECASE 模拟 MySQL utf8mb4_0900_ai_ci 排序规则下不区分大小写的比较。
spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:great_price_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;IGNORECASE=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
  sql:
    init:
      mode: always
      schema-locations:
        - file:sql/schema.sql
        - file:sql/V4__admin.sql
        - file:sql/V5__deal_expiry.sql
        - file:sql/V6__taobao_affiliate.sql
      data-locations: classpath:db/test-data.sql

app:
  admin:
    init-enabled: false
  deal-expiry:
    enabled: false
  taobao:
    enabled: false
    manual-sync-enabled: false
